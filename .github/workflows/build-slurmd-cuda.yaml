---
# Builds and pushes ghcr.io/meshy-dev/slinky-containers/slurmd:*cuda13.2*
# for both EFA and IB fabric variants via matrix strategy. The EFA job also
# builds the fabric-independent control plane (slurmctld-meshy,
# slurmrestd-meshy) from the same patched .debs, used by both clusters.
#
# main pushes the floating version tags plus ${SHA}-suffixed ones. A
# workflow_dispatch on any other ref builds only the cuda targets and pushes
# only the immutable ${SHA}* tags (FLOATING_TAGS=false), so testing a branch
# image never moves a tag that something else builds FROM or pulls.
name: build-slurmd-cuda

on:
  push:
    branches:
      - main
    paths:
      - schedmd/slurm/**
      - .github/workflows/build-slurmd-cuda.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - fabric: efa
            target: "slurmd-cuda-efa login login-cuda-efa slurmctld-meshy slurmrestd-meshy"
            branch_target: "slurmd-cuda-efa login-cuda-efa slurmctld-meshy slurmrestd-meshy"
          - fabric: ib
            target: "slurmd-cuda-ib login-cuda-ib"
            branch_target: "slurmd-cuda-ib login-cuda-ib"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push ${{ matrix.fabric }}
        env:
          BAKE_IMPORTS: schedmd/slurm/25.11/ubuntu24.04/slurm.hcl
          SHA: ${{ github.sha }}
          FLOATING_TAGS: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          TARGETS: ${{ github.ref == 'refs/heads/main' && matrix.target || matrix.branch_target }}
        working-directory: schedmd/slurm
        run: |
          # shellcheck disable=SC2086
          docker buildx bake \
            -f docker-bake.hcl \
            -f 25.11/ubuntu24.04/slurm.hcl \
            ${TARGETS} \
            --metadata-file "${RUNNER_TEMP}/bake-metadata.json" \
            --push

      - name: Image digests
        if: always()
        run: |
          f="${RUNNER_TEMP}/bake-metadata.json"
          [ -f "$f" ] || exit 0
          {
            echo "### ${{ matrix.fabric }} images (${GITHUB_REF_NAME} @ ${GITHUB_SHA})"
            echo
            jq -r 'to_entries[] | select(.value["containerimage.digest"]) | "- \(.key): `\(.value["image.name"])` digest `\(.value["containerimage.digest"])`"' "$f"
          } | tee -a "$GITHUB_STEP_SUMMARY"
